<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none" role="img" aria-label="Activación isométrica del cuádriceps: contracción suave de la parte anterior del muslo acostado boca arriba">
  <rect width="600" height="380" rx="20" fill="#F7FAFB"/>
  <line x1="60" y1="275" x2="540" y2="275" stroke="#173B59" stroke-width="5" stroke-linecap="round"/>

  <!-- Paciente con pierna extendida sobre la superficie -->
  <path d="M120 248 L260 250 L470 252 L482 225" stroke="#173B59" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="355" cy="250" r="11" fill="#32A6A4"/>

  <!-- Indicador de activación en el cuádriceps (muslo anterior) -->
  <path d="M275 222 Q310 210 340 222" stroke="#32A6A4" stroke-width="4" stroke-linecap="round"/>
  <path d="M282 210 Q310 200 335 210" stroke="#32A6A4" stroke-width="3" stroke-linecap="round"/>
  <text x="215" y="182" fill="#173B59" font-family="Inter, sans-serif" font-size="13" font-weight="700">1. Contraer suavemente el muslo</text>

  <!-- Flecha suave hacia abajo en la rodilla -->
  <path d="M355 198 L355 230" stroke="#32A6A4" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="355,236 348,224 362,224" fill="#32A6A4"/>
  <text x="235" y="315" fill="#183044" font-family="Inter, sans-serif" font-size="13" font-weight="600">2. Estirar la rodilla suavemente sin dolor anterior intenso</text>

  <rect x="24" y="22" width="245" height="30" rx="15" fill="#D6F1EE"/>
  <text x="40" y="42" fill="#173B59" font-family="Inter, sans-serif" font-size="12" font-weight="700">COMPLEMENTARIO · CUÁDRICEPS</text>
</svg>
