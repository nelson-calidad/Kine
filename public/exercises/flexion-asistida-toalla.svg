<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none" role="img" aria-label="Flexión asistida con toalla: comparativa Inicio y Final mostrando asistencia suave mientras el talón se desliza hacia el cuerpo sobre la superficie">
  <rect width="680" height="340" rx="22" fill="#F7FAFB"/>

  <!-- PANEL IZQUIERDO: INICIO -->
  <rect x="18" y="18" width="296" height="304" rx="16" fill="#FFFFFF" stroke="#D6F1EE" stroke-width="2"/>
  <rect x="32" y="32" width="76" height="26" rx="13" fill="#D6F1EE"/>
  <text x="51" y="49" fill="#173B59" font-family="Inter, sans-serif" font-size="12" font-weight="800">INICIO</text>

  <line x1="36" y1="238" x2="296" y2="238" stroke="#173B59" stroke-width="4" stroke-linecap="round"/>
  <rect x="42" y="220" width="40" height="15" rx="6" fill="#D6F1EE" stroke="#173B59" stroke-width="1.5"/>
  <circle cx="70" cy="205" r="13" fill="#173B59"/>
  <path d="M84 218 L162 222" stroke="#173B59" stroke-width="18" stroke-linecap="round"/>
  <!-- Pierna en ligera flexión inicial con toalla pasada por el pie -->
  <path d="M162 222 L214 198 L264 226 L276 210" stroke="#32A6A4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="214" cy="198" r="7" fill="#173B59"/>
  <!-- Toalla/correa no elástica -->
  <path d="M128 205 L268 214" stroke="#B7791F" stroke-width="3.5" stroke-dasharray="6 3" stroke-linecap="round"/>
  <text x="40" y="280" fill="#183044" font-family="Inter, sans-serif" font-size="12" font-weight="600">Toalla en el pie · Talón apoyado</text>

  <!-- FLECHA CENTRAL -->
  <circle cx="340" cy="170" r="20" fill="#173B59"/>
  <path d="M332 170 L348 170 M343 164 L349 170 L343 176" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PANEL DERECHO: FINAL -->
  <rect x="366" y="18" width="296" height="304" rx="16" fill="#FFFFFF" stroke="#32A6A4" stroke-width="2"/>
  <rect x="380" y="32" width="76" height="26" rx="13" fill="#32A6A4"/>
  <text x="400" y="49" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800">FINAL</text>

  <line x1="384" y1="238" x2="644" y2="238" stroke="#173B59" stroke-width="4" stroke-linecap="round"/>
  <rect x="390" y="220" width="40" height="15" rx="6" fill="#D6F1EE" stroke="#173B59" stroke-width="1.5"/>
  <circle cx="418" cy="205" r="13" fill="#173B59"/>
  <path d="M432 218 L510 222" stroke="#173B59" stroke-width="18" stroke-linecap="round"/>
  <!-- Pierna flexionada con talón apoyado sobre la cama (sin levantar la pierna al pecho) -->
  <path d="M510 222 L552 162 L592 226 L608 212" stroke="#32A6A4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="552" cy="162" r="7.5" fill="#173B59"/>
  <!-- Toalla acompañando suavemente -->
  <path d="M472 200 L600 214" stroke="#B7791F" stroke-width="4" stroke-dasharray="6 3" stroke-linecap="round"/>
  <path d="M630 256 L580 256" stroke="#32A6A4" stroke-width="3" stroke-linecap="round"/>
  <polygon points="572,256 584,250 584,262" fill="#32A6A4"/>
  <text x="388" y="280" fill="#173B59" font-family="Inter, sans-serif" font-size="12" font-weight="700">Asistencia suave · Talón se desliza apoyado</text>
</svg>
