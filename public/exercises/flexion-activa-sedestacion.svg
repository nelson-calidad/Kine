<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none" role="img" aria-label="Flexión activa en sedestación: comparativa Inicio sentado con pies apoyados y Final deslizando el pie HACIA ATRÁS debajo de la silla para flexionar la rodilla">
  <rect width="680" height="340" rx="22" fill="#F7FAFB"/>

  <!-- PANEL IZQUIERDO: INICIO -->
  <rect x="18" y="18" width="296" height="304" rx="16" fill="#FFFFFF" stroke="#D6F1EE" stroke-width="2"/>
  <rect x="32" y="32" width="76" height="26" rx="13" fill="#D6F1EE"/>
  <text x="51" y="49" fill="#173B59" font-family="Inter, sans-serif" font-size="12" font-weight="800">INICIO</text>

  <line x1="36" y1="248" x2="296" y2="248" stroke="#173B59" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Silla firme -->
  <path d="M106 108 L106 248 M106 178 L182 178 M174 178 L174 248" stroke="#637783" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paciente sentado erguido -->
  <circle cx="132" cy="88" r="13" fill="#173B59"/>
  <path d="M132 106 L132 168 L206 170" stroke="#173B59" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pierna apoyada adelante (posición inicial) -->
  <path d="M206 170 L226 240 L244 240" stroke="#32A6A4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="206" cy="170" r="7.5" fill="#173B59"/>
  <text x="40" y="284" fill="#183044" font-family="Inter, sans-serif" font-size="12" font-weight="600">Sentado en silla firme · Pies apoyados</text>

  <!-- FLECHA CENTRAL -->
  <circle cx="340" cy="170" r="20" fill="#173B59"/>
  <path d="M332 170 L348 170 M343 164 L349 170 L343 176" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PANEL DERECHO: FINAL (FLEXIÓN: PIE HACIA ATRÁS DEBAJO DE LA SILLA) -->
  <rect x="366" y="18" width="296" height="304" rx="16" fill="#FFFFFF" stroke="#32A6A4" stroke-width="2"/>
  <rect x="380" y="32" width="76" height="26" rx="13" fill="#32A6A4"/>
  <text x="400" y="49" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800">FINAL</text>

  <line x1="384" y1="248" x2="644" y2="248" stroke="#173B59" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Silla firme -->
  <path d="M454 108 L454 248 M454 178 L530 178 M522 178 L522 248" stroke="#637783" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paciente sentado erguido -->
  <circle cx="480" cy="88" r="13" fill="#173B59"/>
  <path d="M480 106 L480 168 L554 170" stroke="#173B59" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Referencia punteada inicial -->
  <path d="M554 170 L574 240" stroke="#637783" stroke-width="6" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.4"/>
  <!-- Pierna operada en FLEXIÓN: pie deslizado HACIA ATRÁS debajo de la silla -->
  <path d="M554 170 L504 240 L522 242" stroke="#32A6A4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="554" cy="170" r="7.5" fill="#173B59"/>

  <!-- Flecha hacia atrás debajo de la silla -->
  <path d="M582 262 L506 262" stroke="#173B59" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="496,262 509,256 509,268" fill="#173B59"/>
  <text x="384" y="286" fill="#173B59" font-family="Inter, sans-serif" font-size="12" font-weight="800">Pie HACIA ATRÁS debajo de la silla (Flexión)</text>
</svg>
