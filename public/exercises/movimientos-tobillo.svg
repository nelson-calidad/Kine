<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none" role="img" aria-label="Movimientos de tobillo: flexión dorsal y plantar lenta del pie hacia arriba y hacia abajo">
  <rect width="600" height="380" rx="20" fill="#F7FAFB"/>
  <line x1="80" y1="275" x2="520" y2="275" stroke="#173B59" stroke-width="5" stroke-linecap="round"/>

  <!-- Pierna apoyada -->
  <path d="M140 250 L410 250" stroke="#173B59" stroke-width="20" stroke-linecap="round"/>
  <circle cx="410" cy="250" r="10" fill="#32A6A4"/>

  <!-- Pie hacia arriba (dorsiflexión) -->
  <path d="M410 250 L422 182" stroke="#32A6A4" stroke-width="14" stroke-linecap="round"/>
  <!-- Pie hacia abajo (plantiflexión punteada) -->
  <path d="M410 250 L465 215" stroke="#637783" stroke-width="12" stroke-linecap="round" stroke-dasharray="5 5" opacity="0.55"/>

  <!-- Arco bidireccional -->
  <path d="M435 168 A 65 65 0 0 1 485 215" stroke="#173B59" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="430,166 443,164 438,176" fill="#173B59"/>
  <polygon points="487,221 478,211 490,209" fill="#173B59"/>

  <text x="335" y="142" fill="#173B59" font-family="Inter, sans-serif" font-size="13" font-weight="700">Mover el pie lentamente hacia arriba y abajo</text>

  <rect x="24" y="22" width="265" height="30" rx="15" fill="#D6F1EE"/>
  <text x="40" y="42" fill="#173B59" font-family="Inter, sans-serif" font-size="12" font-weight="700">COMPLEMENTARIO · BOMBA MUSCULAR</text>
</svg>
